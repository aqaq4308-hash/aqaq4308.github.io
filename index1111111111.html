<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>오늘 뭐 먹지? | 학식 투표</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fffbee;
      color: #383629;
      font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
      line-height: 1.5;
    }

    header {
      border-bottom: 1px solid #eae4cc;
      background: #fffdf5;
    }

    .top {
      max-width: 1080px;
      margin: auto;
      padding: 19px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
    }

    .mark {
      background: #f4cb4c;
      border-radius: 12px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .tag {
      margin-left: auto;
      font-size: 13px;
      color: #716c55;
      font-weight: 600;
    }

    main {
      max-width: 1080px;
      margin: auto;
      padding: 58px 24px 70px;
    }

    .eyebrow {
      font-size: 13px;
      color: #887229;
      font-weight: 800;
      letter-spacing: 0.11em;
    }

    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 49px);
      letter-spacing: -0.055em;
      line-height: 1.16;
      margin: 12px 0;
    }

    p {
      margin: 0;
      color: #777463;
    }

    .intro p {
      font-size: 17px;
    }

    .badge {
      background: #fff2c0;
      padding: 10px 15px;
      border-radius: 30px;
      color: #796421;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 22px;
      align-items: start;
    }

    .panel {
      background: #fffefa;
      border: 1px solid #eee8d4;
      border-radius: 22px;
      padding: 27px;
      box-shadow: 0 9px 28px #77642d0a;
    }

    .panel h2 {
      font-size: 21px;
      letter-spacing: -0.04em;
      margin: 0 0 4px;
    }

    .sub {
      font-size: 14px;
      margin-bottom: 22px;
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    .choice {
      font: inherit;
      text-align: left;
      cursor: pointer;
      background: #fffefa;
      border: 1.5px solid #eee9d9;
      border-radius: 15px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: inherit;
      transition: 0.2s;
    }

    .choice:hover {
      border-color: #d9b739;
      background: #fffbee;
    }

    .choice[aria-pressed="true"] {
      border-color: #e2ba32;
      background: #fff8d9;
    }

    .food {
      height: 55px;
      width: 55px;
      border-radius: 13px;
      background: #fff1bc;
      display: grid;
      place-items: center;
      font-size: 29px;
      flex: none;
    }

    .name {
      font-weight: 800;
      font-size: 17px;
    }

    .desc {
      display: block;
      font-size: 13px;
      color: #8a8677;
      margin-top: 2px;
    }

    .radio {
      margin-left: auto;
      width: 22px;
      height: 22px;
      border: 2px solid #ded9c8;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }

    .choice[aria-pressed="true"] .radio {
      border-color: #d8ae20;
    }

    .choice[aria-pressed="true"] .radio::after {
      content: "";
      width: 11px;
      height: 11px;
      background: #d8ae20;
      border-radius: 50%;
    }

    .vote {
      width: 100%;
      border: 0;
      border-radius: 13px;
      background: #edc44a;
      color: #35301c;
      padding: 15px;
      margin-top: 20px;
      font: inherit;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
    }

    .vote:disabled {
      background: #eee9d7;
      color: #a7a18d;
      cursor: not-allowed;
    }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .total {
      color: #8c7840;
      background: #fff5d1;
      border-radius: 20px;
      padding: 6px 11px;
      font-weight: 700;
      font-size: 13px;
    }

    .chart {
      display: grid;
      gap: 22px;
      margin-top: 31px;
    }

    .line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .line strong {
      font-size: 15px;
    }

    .num {
      font-weight: 700;
      color: #776f55;
    }

    .track {
      background: #f3f0e5;
      border-radius: 20px;
      height: 13px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      border-radius: 20px;
      background: #eac044;
      transition: width 0.35s;
    }

    .chart > div:nth-child(2) .fill {
      background: #b1c78d;
    }

    .chart > div:nth-child(3) .fill {
      background: #e6a889;
    }

    .empty {
      margin-top: 23px;
      background: #faf8ef;
      border-radius: 12px;
      padding: 14px;
      color: #817c6c;
      font-size: 14px;
    }

    .note {
      font-size: 13px;
      color: #8f8974;
      margin-top: 18px;
    }

    .reset {
      background: none;
      border: 0;
      text-decoration: underline;
      color: #8c8060;
      cursor: pointer;
      padding: 12px 0;
      font: inherit;
      font-size: 13px;
    }

    .message {
      min-height: 22px;
      margin-top: 8px;
      font-size: 14px;
      color: #6e722d;
      font-weight: 700;
    }

    footer {
      text-align: center;
      font-size: 13px;
      color: #aaa48e;
      margin-top: 36px;
    }

    /* 모바일 화면 */
    @media (max-width: 720px) {
      main {
        padding: 36px 17px 50px;
      }

      .top {
        padding: 15px 18px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 21px;
      }

      .intro {
        display: block;
      }

      .badge {
        display: inline-block;
        margin-top: 20px;
      }

      .tag {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="top">
      <div class="mark">🍴</div>
      <span>오늘의 학식</span>
      <span class="tag">함께 고르는 점심 메뉴</span>
    </div>
  </header>

  <main>
    <section class="intro">
      <div>
        <div class="eyebrow">LUNCH MENU VOTE</div>
        <h1>오늘은 뭐 먹을까요?</h1>
        <p>가장 먹고 싶은 학식 메뉴에 한 표를 남겨주세요.</p>
      </div>

      <div class="badge">☀️ 맛있는 한 끼를 위해</div>
    </section>

    <div class="layout">
      <!-- 메뉴 선택 영역 -->
      <section class="panel">
        <h2>메뉴 선택하기</h2>
        <p class="sub">세 가지 메뉴 중 하나를 골라주세요.</p>

        <div class="choices" id="choices"></div>

        <button class="vote" id="vote" disabled>
          메뉴를 선택해주세요
        </button>

        <div class="message" role="status" id="message"></div>
      </section>

      <!-- 투표 결과 영역 -->
      <section class="panel">
        <div class="result-head">
          <div>
            <h2>투표 결과</h2>
            <p class="sub" style="margin-bottom: 0;">
              어떤 메뉴가 인기 있을까요?
            </p>
          </div>

          <span class="total" id="total">총 0표</span>
        </div>

        <div class="chart" id="chart" aria-live="polite"></div>

        <div class="empty" id="empty">
          아직 투표가 없어요. 첫 번째 투표를 남겨보세요!
        </div>

        <p class="note">
          결과는 이 브라우저에만 저장됩니다.
          다른 사람이나 기기와 공유되지 않아요.
        </p>

        <button class="reset" id="reset">
          투표 결과 초기화
        </button>
      </section>
    </div>

    <footer>
      오늘도 맛있는 하루 보내세요 ☺
    </footer>
  </main>

  <script>
    /*
      메뉴를 바꾸고 싶다면 아래의 name, desc, icon을 수정하세요.
      name: 메뉴 이름
      desc: 메뉴 설명
      icon: 메뉴를 나타내는 이모지
    */
    const menus = [
      {
        name: "제육볶음",
        desc: "매콤달콤 든든한 한 끼",
        icon: "🍚"
      },
      {
        name: "돈가스",
        desc: "바삭하게 즐기는 인기 메뉴",
        icon: "🍛"
      },
      {
        name: "김치찌개",
        desc: "따뜻하고 얼큰한 집밥",
        icon: "🍲"
      }
    ];

    // 브라우저에 투표 결과를 저장할 때 사용하는 이름
    const storageKey = "campus-lunch-vote-v1";

    let counts;

    // 기존에 저장된 투표 결과 불러오기
    try {
      counts = JSON.parse(localStorage.getItem(storageKey));

      if (
        !Array.isArray(counts) ||
        counts.length !== 3 ||
        counts.some(
          number => !Number.isSafeInteger(number) || number < 0
        )
      ) {
        counts = [0, 0, 0];
      }
    } catch {
      counts = [0, 0, 0];
    }

    let selected = null;

    const choices = document.getElementById("choices");
    const chart = document.getElementById("chart");
    const voteButton = document.getElementById("vote");
    const message = document.getElementById("message");
    const total = document.getElementById("total");
    const empty = document.getElementById("empty");
    const resetButton = document.getElementById("reset");

    // 메뉴와 투표 결과를 화면에 표시
    function render() {
      choices.innerHTML = menus.map((menu, index) => {
        const isSelected = selected === index;

        return `
          <button
            class="choice"
            type="button"
            data-index="${index}"
            aria-pressed="${isSelected}"
          >
            <span class="food" aria-hidden="true">
              ${menu.icon}
            </span>

            <span>
              <span class="name">${menu.name}</span>
              <span class="desc">${menu.desc}</span>
            </span>

            <span class="radio" aria-hidden="true"></span>
          </button>
        `;
      }).join("");

      const sum = counts.reduce((a, b) => a + b, 0);

      total.textContent = `총 ${sum}표`;
      empty.hidden = sum > 0;

      chart.innerHTML = menus.map((menu, index) => {
        const percentage = sum
          ? Math.round((counts[index] / sum) * 100)
          : 0;

        return `
          <div>
            <div class="line">
              <strong>${menu.icon} ${menu.name}</strong>
              <span class="num">
                ${counts[index]}표 · ${percentage}%
              </span>
            </div>

            <div
              class="track"
              role="img"
              aria-label="${menu.name} ${counts[index]}표, ${percentage}%"
            >
              <div
                class="fill"
                style="width: ${percentage}%"
              ></div>
            </div>
          </div>
        `;
      }).join("");

      voteButton.disabled = selected === null;

      voteButton.textContent = selected === null
        ? "메뉴를 선택해주세요"
        : `${menus[selected].name}에 투표하기`;
    }

    // 메뉴 선택
    choices.addEventListener("click", event => {
      const button = event.target.closest("button[data-index]");

      if (!button) return;

      selected = Number(button.dataset.index);
      message.textContent = "";

      render();
    });

    // 투표하기
    voteButton.addEventListener("click", () => {
      if (selected === null) return;

      counts[selected]++;

      try {
        localStorage.setItem(storageKey, JSON.stringify(counts));

        message.textContent =
          `${menus[selected].name}에 한 표를 남겼어요!`;
      } catch {
        message.textContent =
          "투표했어요. 브라우저 저장이 불가능해 새로고침하면 결과가 사라집니다.";
      }

      selected = null;
      render();
    });

    // 투표 결과 초기화
    resetButton.addEventListener("click", () => {
      const confirmed = confirm(
        "이 브라우저의 투표 결과를 모두 초기화할까요?"
      );

      if (!confirmed) return;

      counts = [0, 0, 0];

      try {
        localStorage.removeItem(storageKey);
      } catch {
        // 저장소에 접근할 수 없어도 화면상의 결과는 초기화합니다.
      }

      selected = null;
      message.textContent = "투표 결과를 초기화했어요.";

      render();
    });

    // 처음 페이지를 열었을 때 화면 표시
    render();
  </script>
</body>
</html>
